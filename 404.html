<!DOCTYPE html>
<html lang="pl">

<head>
    <script>
        (function () {
            var knownRoutes = ['/catalog', '/inventory', '/not-found'];
            var path = window.location.pathname;
            var host = window.location.hostname;
            var segments = path.split('/').filter(Boolean);

            if (host.endsWith('.github.io') && segments.length === 1 && path === '/' + segments[0]) {
                window.location.replace(path + '/' + window.location.search + window.location.hash);
                return;
            }

            function detectBaseHref() {
                var existing = document.querySelector('base');
                if (existing) {
                    var href = existing.getAttribute('href');
                    if (href)
                        return href;
                }

                for (var i = 0; i < knownRoutes.length; i++) {
                    var route = knownRoutes[i];
                    if (path === route || path.endsWith(route)) {
                        var basePath = path.slice(0, path.length - route.length);
                        return basePath.endsWith('/') ? basePath : (basePath ? basePath + '/' : '/');
                    }
                }

                if (host.endsWith('.github.io') && segments.length > 0)
                    return '/' + segments[0] + '/';

                if (segments.length === 1)
                    return '/' + segments[0] + '/';

                return '/';
            }

            var base = document.querySelector('base');
            if (!base) {
                base = document.createElement('base');
                document.head.insertBefore(base, document.head.firstChild);
            }
            base.href = detectBaseHref();
        })();
    </script>
